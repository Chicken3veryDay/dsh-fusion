# The automation-only ACP application over dsh-base. Stdout belongs to ACP.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

# Strict loading keeps every applicable workspace rule whole or refuses the request;
# the budget and candidate files stay those of the dsh-base row this replaces.
- id: agent-instructions
  config:
    maxBytes: 65536
    mode: strict

- id: session-title-llm
  disabled: true

- insert:
    - id: acp-app-startup
      name: '@deepseek-ai/dsh-acp-app'

    - id: acp
      name: '@deepseek-ai/dsh-acp'
      inject: [acpAppStartup]
      config:
        provider: deepseek-official
        model: deepseek-v4-flash

- id: hmr
  disabled: true
