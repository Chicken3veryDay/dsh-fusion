# DSH owns the loop, Script tools and persistence; only HTTPS is intercepted.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- id: llm-pi-ai
  config:
    providers:
      anthropic:
        signInOnly: true
- insert:
    - id: snapshot-clock
      name: './clock.mjs'
    - id: anthropic-oauth-fixture
      name: './oauth-endpoint.mjs'
- id: time-context
  config:
    timeZone: UTC
