# Session-title snapshot composition: the optional first-prompt provider uses
# the ordinary DeepSeek route while the every other capability stay
# identical to the base example.
- insert:
    - id: session-title-provider
      name: '@deepseek-ai/dsh-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 32
        timeoutMs: 5000
        provider: deepseek-official
        model: deepseek-v4-flash

# Protocol and projection coverage retains native calls; PTC defaults have separate scenarios.
- id: tool-executor-native
  disabled: false

- id: tool-executor-ptc
  disabled: true
