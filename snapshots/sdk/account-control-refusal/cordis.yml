# The shipped SDK profile uses the real Responses adapter and an official
# origin with a synthetic session-shaped stored key. No HTTP request is allowed.

# The fixture corpus must not depend on the developer's personal skill roots.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false

# No DeepSeek route participates in this account-control recording.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

# The process-local clock is deterministic; native timers remain live.
- insert:
    - id: snapshot-clock
      name: './clock.mjs'
    - id: refusal-fixture
      name: './refusal-fixture.mjs'

- id: time-context
  config:
    timeZone: UTC
