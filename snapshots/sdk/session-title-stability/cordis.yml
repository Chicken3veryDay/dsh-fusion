# Continuous session-title composition with the shipped all-prompts provider.
- insert:
    - id: session-title-provider
      name: '@deepseek-ai/dsh-session-title-all-prompts-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 32
        timeoutMs: 5000
        provider: deepseek-official
        model: deepseek-v4-flash

# Protocol and projection coverage retains native calls; PTC defaults have separate scenarios.
- id: tool-executor-native
  disabled: false

- id: tool-executor-ptc
  disabled: true
