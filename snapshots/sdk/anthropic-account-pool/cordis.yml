# DSH owns the loop, Script tools and persistence; two synthetic Claude subscription accounts, each in its own
# credential document, are the only variable. Only HTTPS is intercepted.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- id: llm-pi-ai
  config:
    providers:
      anthropic:
        accounts:
          - id: pool-a
            credentialsPath: !!js dshHomePath('accounts/pool-a.credentials.yaml')
          - id: pool-b
            credentialsPath: !!js dshHomePath('accounts/pool-b.credentials.yaml')
- insert:
    - id: snapshot-clock
      name: './clock.mjs'
    - id: anthropic-pool-fixture
      name: './pool-endpoint.mjs'
- id: time-context
  config:
    timeZone: UTC
