# TypeScript SDK snapshot patch over `dsh --profile sdk`: the official DeepSeek
# Messages route runs the real llm-deepseek adapter with thinking enabled, and an
# extension proposes a `temperature` that the official service ignores in thinking
# mode. Preparation must refuse it before any credential, header or HTTP work.
# The external HTTPS endpoint is trapped.

# The fixture corpus must not depend on the developer's personal skill roots.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false

# Official origin, explicit model metadata (so no listing request) and the
# synthetic `DEEPSEEK_API_KEY` that the replay environment supplies.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    baseURL: https://api.deepseek.com/anthropic
    thinking: enabled
    reasoningEffort: high
    models:
      - id: deepseek-flash

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

# The process-local clock is deterministic; native timers remain live.
- insert:
    - id: snapshot-clock
      name: './clock.mjs'
    - id: refusal-fixture
      name: './refusal-fixture.mjs'

- id: time-context
  config:
    timeZone: UTC
