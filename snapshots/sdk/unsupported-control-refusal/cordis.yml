# TypeScript SDK snapshot patch over `dsh --profile sdk`: the signed-in Codex
# route runs the real llm-pi-ai adapter, and an extension proposes a `stop`
# list that adapter cannot send. The external HTTPS endpoint is trapped.

# The fixture corpus must not depend on the developer's personal skill roots.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false

# No API-key route: the stored sign-in is the only credential this scenario holds.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

# The process-local clock is deterministic; native timers remain live.
- insert:
    - id: snapshot-clock
      name: './clock.mjs'
    - id: refusal-fixture
      name: './refusal-fixture.mjs'

- id: time-context
  config:
    timeZone: UTC
